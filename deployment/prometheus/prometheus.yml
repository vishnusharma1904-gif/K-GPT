# Prometheus configuration for Prompt Pulse
# Scrapes metrics from the FastAPI backend every 15 seconds.

global:
  scrape_interval: 15s       # how often to pull metrics from targets
  evaluation_interval: 15s   # how often to evaluate alerting rules

scrape_configs:
  # FastAPI backend exposes /metrics via prometheus_fastapi_instrumentator
  - job_name: "promptpulse-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8400"]
        labels:
          service: "backend"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Redis exporter (optional, add redis_exporter service if needed)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
